name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  # The draft exists before the build starts so `mygo build -upload` has
  # a release to put the installers and update files in.
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build-macos:
    needs: draft-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: go test ./...

      # The tag is the version of record; stamp it into the build config so
      # the bundle, the update manifest and the release agree (v1.2.3 -> 1.2.3).
      - name: Set version from tag
        run: |
          sed -i '' "s/version: \".*\"/version: \"${GITHUB_REF_NAME#v}\"/" mygo.config.ts

      # Universal covers Apple silicon and Intel in one archive. Signs the
      # update with MYGO_UPDATER_PRIVATE_KEY and uploads the DMG, the signed
      # update archive and update-darwin-universal.json to the draft release.
      # Ad-hoc code signing while no Developer ID is configured.
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bun run build -- -platform darwin/universal -upload

  publish:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      # The updater needs the tarball and manifest; install.sh is a Linux
      # installer script and SHA256SUMS is for manual checksums — both are
      # noise on a macOS-only release.
      - name: Prune unneeded assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset "$GITHUB_REF_NAME" install.sh --repo "$GITHUB_REPOSITORY" -y || true
          gh release delete-asset "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" -y || true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
