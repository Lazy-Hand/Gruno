name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: go test ./...

      # The tag is the version of record; stamp it into the build config so
      # the bundle and disk image carry it (v1.2.3 -> 1.2.3).
      - name: Set version from tag
        run: |
          sed -i '' "s/version: \".*\"/version: \"${GITHUB_REF_NAME#v}\"/" mygo.config.ts

      # Ad hoc signing (no Developer ID configured); universal covers both
      # Apple silicon and Intel macs from one archive.
      - name: Build app and DMG
        run: bun run build -- -platform darwin/universal

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/**/*.dmg
          generate_release_notes: true
